name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,ontology]"

      - name: Lint (ruff)
        run: ruff check src/agentic_memory_sdk

      - name: Test (pytest + coverage)
        run: pytest tests/test_composite_memory_platform.py --cov=agentic_memory_sdk --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  e2e-docker:
    name: E2E Docker Stack (Postgres + Neo4j + Redis + A2A)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start Docker Compose Stack (Postgres pgvector, Neo4j, Redis)
        run: docker compose up -d --wait

      - name: Install dependencies
        run: pip install -e ".[dev,ontology]"

      - name: Run Live Docker & Multi-Agent A2A E2E Suite
        run: pytest tests/test_a2a_docker_e2e.py -v

      - name: Tear down Docker Compose Stack
        if: always()
        run: docker compose down -v

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [test, e2e-docker]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Check dist
        run: pip install twine && twine check dist/*

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Single required status check — set THIS name in branch protection rules.
  # It passes only when every matrix test job, the Docker E2E job, and the build job succeed.
  ci:
    name: CI
    runs-on: ubuntu-latest
    needs: [test, e2e-docker, build]
    if: always()
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ needs.test.result }}" != "success" || "${{ needs.e2e-docker.result }}" != "success" || "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more jobs failed: test=${{ needs.test.result }} e2e-docker=${{ needs.e2e-docker.result }} build=${{ needs.build.result }}"
            exit 1
          fi
          echo "All jobs passed."
