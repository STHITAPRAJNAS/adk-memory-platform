[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-memory-sdk"
version = "0.1.0"
description = "Enterprise Multi-Tenant Ontology-Grounded Composite Memory SDK, MCP Server & Platform Service for Google ADK Agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = [
    "google-adk",
    "a2a",
    "mcp",
    "agent-memory",
    "knowledge-graph",
    "bitemporal",
    "ontology",
    "pgvector",
    "neo4j",
    "neptune",
    "opensearch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "asyncpg>=0.29.0",
    "neo4j>=5.20.0",
    "redis>=5.0.0",
    "mcp>=1.2.0",
    "google-adk[a2a]>=2.8.0",
    "a2a-sdk>=1.1.2",
]

[project.scripts]
adk-memory = "agentic_memory_sdk.cli:main"

[project.optional-dependencies]
aws = [
    "boto3>=1.34.0",
]
gcp = [
    "google-auth>=2.29.0",
]
azure = [
    "azure-identity>=1.16.0",
]
local-embed = [
    "sentence-transformers>=3.0.0",
]
opensearch = [
    "opensearch-py[async]>=2.6.0",
]
neptune = [
    "boto3>=1.34.0",
]
ontology = [
    "rdflib>=7.0.0",
    "pyshacl>=0.26.0",
]
all = [
    "boto3>=1.34.0",
    "google-auth>=2.29.0",
    "azure-identity>=1.16.0",
    "opensearch-py[async]>=2.6.0",
    "rdflib>=7.0.0",
    "pyshacl>=0.26.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "rdflib>=7.0.0",
    "pyshacl>=0.26.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_memory_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "src/agentic_memory_sdk/**",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning",
]
