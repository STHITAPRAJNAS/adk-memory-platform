[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-composite-memory"
version = "0.1.5"
description = "Enterprise Multi-Tenant Ontology-Grounded Composite Memory SDK, MCP Server & Platform Service for Google ADK Agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sthitaprajna Sahoo", email = "papu.sahoo@gmail.com" }]
maintainers = [{ name = "Sthitaprajna Sahoo", email = "papu.sahoo@gmail.com" }]
requires-python = ">=3.11"
keywords = [
    "google-adk",
    "a2a",
    "mcp",
    "agent-memory",
    "composite-memory",
    "knowledge-graph",
    "bitemporal",
    "ontology",
    "pgvector",
    "neo4j",
    "neptune",
    "redis",
    "opensearch",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "asyncpg>=0.29.0",
    "neo4j>=5.20.0",
    "redis>=5.0.0",
    "mcp>=1.2.0",
    "google-adk[a2a]>=2.8.0",
    "a2a-sdk>=1.1.2",
]

[project.urls]
Homepage      = "https://github.com/sthitaprajnas/adk-memory-platform"
Repository    = "https://github.com/sthitaprajnas/adk-memory-platform"
Documentation = "https://github.com/sthitaprajnas/adk-memory-platform#readme"
Changelog     = "https://github.com/sthitaprajnas/adk-memory-platform/blob/main/CHANGELOG.md"
Issues        = "https://github.com/sthitaprajnas/adk-memory-platform/issues"

[project.scripts]
adk-memory = "agentic_memory_sdk.cli:main"

[project.optional-dependencies]
aws = [
    "boto3>=1.34.0",
]
gcp = [
    "google-auth>=2.29.0",
]
azure = [
    "azure-identity>=1.16.0",
]
local-embed = [
    "sentence-transformers>=3.0.0",
]
opensearch = [
    "opensearch-py[async]>=2.6.0",
]
neptune = [
    "boto3>=1.34.0",
]
ontology = [
    "rdflib>=7.0.0",
    "pyshacl>=0.26.0",
]
all = [
    "boto3>=1.34.0",
    "google-auth>=2.29.0",
    "azure-identity>=1.16.0",
    "opensearch-py[async]>=2.6.0",
    "rdflib>=7.0.0",
    "pyshacl>=0.26.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "build>=1.2.0",
    "twine>=5.0.0",
    "rdflib>=7.0.0",
    "pyshacl>=0.26.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_memory_sdk", "src/agentic_composite_memory"]

[tool.hatch.build.targets.sdist]
include = [
    "src/agentic_memory_sdk/**",
    "src/agentic_composite_memory/**",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]
filterwarnings = [
    "ignore::UserWarning",
]
